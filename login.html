<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodHub · Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">FoodHub</div>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="login.html">Login</a>
    </nav>
  </header>

  <main class="login-page">
    <section class="login-panel">
      <div class="login-copy">
        <p class="eyebrow">Welcome back</p>
        <h1>Login to your FoodHub account</h1>
        <p>Enter your details to continue ordering delicious meals from your favorite restaurants.</p>
      </div>
      <form id="loginForm" class="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="********" required />

        <button type="submit" class="primary-button">Login</button>
        <p class="login-hint">No account yet? <a href="index.html">Return to Home</a></p>
        <p id="loginMessage" class="login-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
